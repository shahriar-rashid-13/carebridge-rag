name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Script syntax and classifier metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check script syntax
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - run: pip install -r requirements-eval.txt
      # Re-runs the symptom-to-specialization classifier on the committed corpus,
      # so the reported precision, recall and F1 can be reproduced from the repo.
      - name: Classifier evaluation
        run: python scripts/classify-eval.py

  ragas-gate:
    name: RAGAS quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hard when LITELLM_MASTER_KEY repo secret is present (committed real_ragas
    # results + calibrated floors). Soft-skip warning when secret absent (forks).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline RAGAS harness (syntax / pipeline smoke)
        run: node scripts/ragas-eval.mjs --mode offline --limit 3
      - name: Restore committed live results for gate
        # Offline --limit overwrites results; restore the live artifact for hard gate.
        run: git checkout -- eval/ragas-results.json eval/RAGAS_EVAL_REPORT.md
      - name: RAGAS gate (hard when secrets present)
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          # Hard when the secret exists; gate script still soft-skips if key empty.
          RAGAS_GATE_HARD: ${{ secrets.LITELLM_MASTER_KEY != '' && '1' || '0' }}
        run: node scripts/ragas-gate.mjs --hard
      - name: Show calibrated thresholds
        run: cat eval/ragas-thresholds.json
