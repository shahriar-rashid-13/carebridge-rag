name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Script syntax and classifier metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check script syntax
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - run: pip install -r requirements-eval.txt
      # Re-runs the symptom-to-specialization classifier on the committed corpus,
      # so the reported precision, recall and F1 can be reproduced from the repo.
      - name: Classifier evaluation
        run: python scripts/classify-eval.py

  ragas-gate:
    name: RAGAS quality gate (soft skeleton)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Soft today: missing LITELLM_MASTER_KEY → warning + pass.
    # Tomorrow: add the secret, produce real_ragas results, then set
    # RAGAS_GATE_HARD=1 (or pass --hard) to enforce eval/ragas-thresholds.json.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline RAGAS harness (no secrets)
        run: node scripts/ragas-eval.mjs --mode offline
      - name: Soft RAGAS gate
        env:
          # Intentionally unset for soft-skip path when repo secret absent.
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          # Keep hard mode off until live scores + calibrated floors exist.
          RAGAS_GATE_HARD: "0"
        run: node scripts/ragas-gate.mjs
      - name: Document tomorrow hard thresholds
        run: |
          echo "Planned hard floors (eval/ragas-thresholds.json):"
          cat eval/ragas-thresholds.json
          echo ""
          echo "Tomorrow: set repo secrets LITELLM_MASTER_KEY (+ BASE_URL),"
          echo "wire live RAGAS, write real_ragas=true results, then RAGAS_GATE_HARD=1."
